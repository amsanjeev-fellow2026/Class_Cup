<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05071A; --night:#0B1030; --navy:#141C4A; --chalk:#F5F7FA;
  --gold:#FFC928; --red:#FF3B4E; --blue:#2F8CFF; --lime:#C8F31D;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --ui:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--ink);color:var(--chalk);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#viewport{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:var(--night)}
#scene{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.hide{display:none !important}

/* buttons */
.btn{font-family:var(--display);font-size:34px;letter-spacing:.03em;line-height:1;color:#14100A;background:var(--gold);border:0;border-radius:8px;padding:20px 38px;cursor:pointer;box-shadow:0 7px 0 #A67C00,0 12px 24px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #A67C00,0 4px 10px rgba(0,0,0,.45)}
.btn:focus-visible,.mini:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.big{font-size:44px;padding:24px 44px}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--chalk);box-shadow:0 5px 0 rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.35);font-size:26px;padding:14px 26px}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.mini{font-family:var(--ui);font-weight:700;font-size:18px;color:var(--chalk);background:rgba(7,10,34,.82);border:2px solid rgba(255,255,255,.28);border-radius:6px;padding:10px 16px;cursor:pointer}
.mini:hover{background:rgba(30,40,100,.9)}

/* HUD */
#roundChip{position:absolute;left:18px;top:12px;width:150px;height:84px;padding:10px 12px;background:linear-gradient(180deg,rgba(14,20,64,.94),rgba(7,10,34,.96));border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.35);border-left:6px solid var(--gold)}
#rcNum{font-family:var(--display);font-size:28px;line-height:1.05}
#rcType{font-weight:600;font-size:16px;line-height:1.2;margin-top:6px;opacity:.9}
#roundChip.gold{background:linear-gradient(180deg,#FFD65A,#E8A800);color:#1A1400}
#roundChip.gold #rcType{opacity:1}
#tiles{position:absolute;left:182px;right:260px;top:12px;display:flex;gap:12px}
.tile{flex:1;position:relative;height:84px;background:linear-gradient(180deg,rgba(14,20,64,.94),rgba(7,10,34,.96));border-radius:6px;padding:8px 12px 0 22px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .25s,box-shadow .25s}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--tc)}
.tt-name{font-family:var(--display);font-size:24px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:135px}
.tt-score{position:absolute;right:14px;top:4px;font-family:var(--display);font-size:62px;line-height:1.15}
.tt-score.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
.tt-dots{position:absolute;left:22px;bottom:10px;display:flex;gap:4px}
.tt-dots i{display:block;width:11px;height:6px;border-radius:2px;background:rgba(255,255,255,.18)}
.tt-dots i.on{background:var(--tc)}
.tile.active{transform:translateY(5px) scale(1.04);box-shadow:0 0 0 3px var(--tc),0 0 34px var(--tcg)}
#menuBtn{position:absolute;right:18px;top:12px;width:112px}
#muteBtn{position:absolute;right:18px;top:62px;width:112px}
#hint{position:absolute;left:50%;top:116px;transform:translateX(-50%);max-width:760px;text-align:center;font-weight:700;font-size:26px;line-height:1.25;padding:10px 26px;background:rgba(7,10,34,.86);border-radius:40px;border:2px solid rgba(255,255,255,.22);white-space:nowrap}
#hint.result{font-size:30px;border-color:var(--gold)}
#hint b{font-family:var(--display);font-weight:400;font-size:40px;color:var(--gold);margin-right:10px;vertical-align:-3px}
#hint.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1) both}

/* lower third */
#lower{position:absolute;left:24px;bottom:22px;width:420px;height:96px;display:flex;background:linear-gradient(90deg,rgba(7,10,34,.95),rgba(14,20,64,.9));border-radius:6px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.35);animation:slideIn .45s cubic-bezier(.2,1,.3,1) both}
#lower .stripe{width:14px;background:var(--tc)}
#lower .lt-body{padding:10px 16px;min-width:0}
#lower .lt-label{font-weight:600;font-size:16px;opacity:.75}
#ltName{font-family:var(--display);font-size:44px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:370px}
#ltTeam{font-weight:700;font-size:18px;color:var(--tc)}

/* turn card */
#card{position:absolute;left:310px;top:128px;width:660px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
#card .c-top{height:16px;background:var(--tc);border-radius:10px 10px 0 0}
#card .c-body{background:linear-gradient(180deg,rgba(14,20,64,.97),rgba(7,10,34,.98));padding:20px 30px 26px;border-radius:0 0 10px 10px}
#card .c-team{font-weight:700;font-size:28px;color:var(--tc)}
#card .c-name{font-family:var(--display);font-size:104px;line-height:1.05;margin:4px 0 12px;overflow-wrap:anywhere}
#card .c-chips{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.chip{font-weight:700;font-size:20px;padding:7px 16px;border-radius:30px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25)}
.chip.gold{background:var(--gold);color:#1A1400;border-color:var(--gold)}
#card .c-desc{font-size:25px;line-height:1.3;opacity:.92}

/* action */
#absentBtn{position:absolute;left:24px;bottom:30px;font-size:22px;padding:12px 20px;max-width:430px;line-height:1.1;text-align:left}
#actionWrap{position:absolute;left:470px;width:340px;bottom:22px;text-align:center}
#actionWrap .btn{width:100%}
#actionWrap .btn.pulse{animation:pulse 1.1s ease-in-out infinite}

/* menu */
#menuPanel{position:absolute;left:400px;top:66px;width:480px;padding:18px 22px;background:rgba(7,10,34,.97);border:2px solid rgba(255,255,255,.3);border-radius:12px;display:grid;gap:10px;z-index:30;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#menuPanel h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:34px}
#menuPanel .btn{font-size:21px;padding:11px 18px;text-align:left}

/* screens */
.screen{position:absolute;inset:0;z-index:20}
#title{background:linear-gradient(180deg,rgba(5,7,26,.25) 0%,rgba(5,7,26,0) 40%,rgba(5,7,26,.7) 100%)}
.stripes{position:absolute;left:-60px;top:70px;width:1400px;height:230px;transform:skewY(-5deg)}
.stripes i{position:absolute;left:0;width:100%;height:60px;animation:sweep .9s cubic-bezier(.2,.9,.2,1) both}
.stripes i:nth-child(1){top:0;background:var(--red);animation-delay:.05s}
.stripes i:nth-child(2){top:80px;background:var(--blue);animation-delay:.2s}
.stripes i:nth-child(3){top:160px;background:var(--gold);animation-delay:.35s}
.t-logo{position:absolute;left:0;right:0;top:60px;display:flex;justify-content:center;align-items:center;gap:22px;font-family:var(--display);font-size:190px;line-height:1.1;animation:logoIn .8s .55s cubic-bezier(.2,1.3,.3,1) both;filter:drop-shadow(0 10px 0 rgba(0,0,0,.45))}
.t-cup{background:var(--gold);color:#14100A;padding:0 26px;transform:skewX(-8deg)}
.t-sub{position:absolute;left:0;right:0;top:318px;text-align:center;font-weight:700;font-size:34px;text-shadow:0 3px 10px rgba(0,0,0,.8)}
.t-actions{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:center;gap:24px;align-items:center}
.t-partner{position:absolute;left:0;right:0;top:392px;display:flex;justify-content:center;pointer-events:none}
.t-partner img{height:62px;padding:12px 26px;box-sizing:content-box;background:rgba(5,7,26,.72);border-radius:10px;border:2px solid rgba(255,255,255,.18)}
.f-logo{position:absolute;left:30px;top:26px;height:40px;pointer-events:none;opacity:.95}
.t-credit{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-weight:600;font-size:20px;opacity:.85}

#setup{background:rgba(5,7,26,.88);padding:22px 40px 20px;display:flex;flex-direction:column}
#setup h2{margin:0;font-family:var(--display);font-weight:400;font-size:46px;line-height:1.1;flex:none}
#setup .s-sub{font-size:20px;opacity:.88;margin:2px 0 10px;flex:none}
.teams3{display:flex;gap:18px;flex:1 1 0;min-height:0}
.tcard{flex:1;display:flex;flex-direction:column;min-height:0;background:rgba(20,28,74,.85);border-radius:10px;overflow:hidden;border-top:12px solid var(--tc);padding:12px 16px 10px}
.tcard .tname{width:100%;font-family:var(--display);font-size:34px;color:var(--chalk);background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 12px;-webkit-user-select:text;user-select:text}
.tcard textarea{width:100%;flex:1 1 0;min-height:60px;margin-top:8px;resize:none;font-family:var(--ui);font-weight:600;font-size:23px;line-height:1.35;color:var(--chalk);background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);border-radius:6px;padding:8px 12px;-webkit-user-select:text;user-select:text}
.tcard input:focus,.tcard textarea:focus{outline:3px solid var(--tc);outline-offset:1px}
.tcard .tcount{flex:none;margin-top:6px;font-weight:700;font-size:20px;color:var(--tc)}
#plan{flex:none;margin-top:10px;font-size:18px;line-height:1.3;background:rgba(255,255,255,.07);border-radius:8px;padding:8px 16px}
#plan b{color:var(--gold)}
.s-actions{flex:none;margin-top:12px;display:flex;gap:16px;justify-content:space-between;align-items:center}
.s-actions .grp{display:flex;gap:16px;align-items:center}

#final{background:radial-gradient(ellipse at 50% 40%,rgba(10,16,60,.55),rgba(5,7,26,.88));text-align:center}
.f-title{position:absolute;left:0;right:0;top:20px;font-family:var(--display);font-size:78px;line-height:1.1}
#podium{position:absolute;left:0;right:0;top:128px;height:380px;display:flex;justify-content:center;align-items:flex-end;gap:22px}
.pcol{width:290px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(60px) scale(.9);transition:opacity .5s,transform .6s cubic-bezier(.2,1.4,.4,1)}
.pcol.show{opacity:1;transform:none}
.pcol .trophy{width:96px;height:112px;margin-bottom:4px;animation:bob 1.6s ease-in-out infinite}
.pcol .pname{font-family:var(--display);font-size:38px;line-height:1.1;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcol .pscore{font-family:var(--display);font-size:70px;line-height:1.1}
.pcol .pbar{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--tc),var(--tcd));display:flex;justify-content:center;align-items:flex-start;padding-top:10px;font-family:var(--display);font-size:60px;color:rgba(255,255,255,.9)}
.pcol.r1 .pbar{height:170px}.pcol.r2 .pbar{height:120px}.pcol.r3 .pbar{height:84px}
#potm{position:absolute;left:0;right:0;top:528px;font-weight:700;font-size:28px;opacity:0;transition:opacity .6s}
#potm.show{opacity:1}
#potm span{color:var(--gold)}
.f-actions{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:20px}

@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
#card{transform-origin:50% 40%}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes slideIn{0%{transform:translateX(-120%)}100%{transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:none}}
@keyframes logoIn{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="scene" width="1280" height="720"></canvas>

  <div id="roundChip" class="hide"><div id="rcNum"></div><div id="rcType"></div></div>
  <div id="tiles" class="hide"></div>
  <button id="menuBtn" class="mini hide" type="button">Menu</button>
  <button id="muteBtn" class="mini hide" type="button">Sound on</button>
  <div id="hint" class="hide"></div>
  <div id="lower" class="hide" style="--tc:#fff"><div class="stripe"></div><div class="lt-body"><div class="lt-label">Now kicking</div><div id="ltName"></div><div id="ltTeam"></div></div></div>
  <div id="card" class="hide" style="--tc:#fff"><div class="c-top"></div><div class="c-body"><div class="c-team" id="cTeam"></div><div class="c-name" id="cName"></div><div class="c-chips" id="cChips"></div><div class="c-desc" id="cDesc"></div></div></div>
  <button id="absentBtn" class="btn ghost hide" type="button">Absent? Call another teammate</button>
  <div id="actionWrap" class="hide"><button id="actionBtn" class="btn big pulse" type="button">Start kick</button></div>

  <div id="menuPanel" class="hide">
    <h3>Match menu</h3>
    <button id="mMusic" class="btn ghost" type="button"></button>
    <button id="mSfx" class="btn ghost" type="button"></button>
    <button id="mVoice" class="btn ghost" type="button"></button>
    <button id="mFull" class="btn ghost" type="button">Full screen</button>
    <button id="mCall" class="btn ghost" type="button">Absent? Call another teammate</button>
    <button id="mSkip" class="btn ghost" type="button">Skip this kick (no replacement)</button>
    <button id="mQuit" class="btn ghost" type="button">Quit to setup</button>
    <button id="mClose" class="btn" type="button">Back to the match</button>
  </div>

  <section id="title" class="screen">
    <div class="stripes"><i></i><i></i><i></i></div>
    <div class="t-logo"><span>CLASS</span><span class="t-cup">CUP</span></div>
    <div class="t-sub">Matchday. Every student gets a kick.</div>
    <div class="t-actions">
      <button id="kickoffBtn" class="btn big" type="button">Kick off</button>
      <button id="resumeBtn" class="btn ghost hide" type="button">Resume saved match</button>
    </div>
    <div class="t-partner"><img id="tfiTitle" alt="Teach For India" draggable="false"></div>
    <div class="t-credit">Made by AMSanjeev</div>
  </section>

  <section id="setup" class="screen hide">
    <h2>Match setup</h2>
    <div class="s-sub">Type one student name per line. Every team gets the same number of kicks, so smaller teams kick more often.</div>
    <div class="teams3" id="teams3"></div>
    <div id="plan"></div>
    <div class="s-actions">
      <div class="grp"><button id="backBtn" class="btn ghost" type="button">Back</button><button id="sampleBtn" class="btn ghost" type="button">Fill sample names</button></div>
      <button id="startBtn" class="btn big" type="button" disabled>Start match</button>
    </div>
  </section>

  <section id="final" class="screen hide">
    <img id="tfiFinal" class="f-logo" alt="Teach For India" draggable="false">
    <div class="f-title">Full time</div>
    <div id="podium"></div>
    <div id="potm"></div>
    <div class="f-actions"><button id="againBtn" class="btn" type="button">Play again</button><button id="newBtn" class="btn ghost" type="button">New setup</button></div>
  </section>
</div>
</div>

<script>
(() => {
'use strict';

/* ================= utilities ================= */
const W = 1280, H = 720;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pick = a => a[Math.floor(Math.random() * a.length)];
const nowS = () => performance.now() / 1000;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const TEAM_STYLE = [
  { main: '#FF3B4E', dark: '#9E1022', glow: 'rgba(255,59,78,.6)', text: '#FFFFFF', defName: 'Red Rockets' },
  { main: '#2F8CFF', dark: '#0F4DA8', glow: 'rgba(47,140,255,.6)', text: '#FFFFFF', defName: 'Blue Thunder' },
  { main: '#FFC928', dark: '#9C7400', glow: 'rgba(255,201,40,.6)', text: '#1A1400', defName: 'Gold Strikers' }
];
const TYPES = {
  penalty: { name: 'Penalty kick', desc: 'Lock your aim, then lock your power. Beat the keeper.' },
  freekick: { name: 'Free kick', desc: 'Go over or around the wall. The keeper is waiting.' },
  target: { name: 'Target blitz', desc: 'No keeper. Hit the glowing targets. Corners are worth the most.' }
};
const TARGETS = [
  { x: -0.68, y: 0.78, pts: 3, rp: 36 }, { x: 0.68, y: 0.78, pts: 3, rp: 36 },
  { x: -0.68, y: 0.24, pts: 2, rp: 36 }, { x: 0.68, y: 0.24, pts: 2, rp: 36 },
  { x: 0, y: 0.52, pts: 1, rp: 42 }
];
const LINES = {
  goal: ['What a strike!', 'Back of the net!', 'Unstoppable!', 'Pure class!', 'Absolutely clinical!', 'Sensational!'],
  topbins: ['Top bins!', 'Right in the corner!', 'Unbelievable placement!'],
  save: ['What a save!', 'Denied by the keeper!', 'Safe hands!', 'Not today!'],
  post: ['Off the woodwork!', 'So close! Hit the frame!', 'Agonisingly close!'],
  miss: ['Just missed!', 'Wide of the mark!', 'So close, but no goal.'],
  blocked: ['Blocked by the wall!', 'The wall stands tall!'],
  weak: ['Not enough power!', 'That one ran out of steam.'],
  bullseye: ['Bullseye!', 'Right on target!', 'Dead centre!']
};

/* ================= state ================= */
const S = {
  screen: 'title', teams: [], turns: [], t: 0, sdN: 0, phase: 'idle', cur: null, canNext: false,
  aim: null, ret: { x: 0, y: 1 }, pw: 0, power: 0, aimT0: 0, powT0: 0, shot: null,
  ball: { x: 640, y: 575, r: 24, rot: 0, mode: 'idle', alpha: 1, vx: 0, vy: 0, g: 0 },
  keeper: { idle: 0, kx: 0, ky: 0.3, start: null, dir: 0 },
  sceneType: 'idle', targets: [], net: null, pop: null, shake: 0, flash: 0, excite: 0.15,
  wallJump: 0, wallJumpT: -9, trail: [], resultAt: 0, lastAct: 0, quitArmed: false
};

/* ================= canvas setup ================= */
const stage = $('stage'), cv = $('scene'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  const vp = $('viewport');
  const w = vp.clientWidth || window.innerWidth, h = vp.clientHeight || window.innerHeight;
  scale = Math.min(w / W, h / H);
  stage.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(2, Math.round(W * scale * dpr));
  cv.height = Math.max(2, Math.round(H * scale * dpr));
}
window.addEventListener('resize', resize);

/* ================= audio ================= */
const AU = { ctx: null, master: null, music: null, sfx: null, crowd: null, crowdFilter: null, noise: null,
  musicOn: true, sfxOn: true, voiceOn: true, seqTimer: null, step: 0, nextTime: 0, leadAlways: true, leadUntil: 0, rollTimer: null, rollN: 0 };
const BPM = 118, STEP = 60 / BPM / 4;

function initAudio() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  try {
    const c = AU.ctx = new C();
    AU.master = c.createGain(); AU.master.gain.value = 0.9;
    const comp = c.createDynamicsCompressor();

    const st = TEAM_STYLE[o.t.slot], d = document.createElement('div');
    d.className = 'pcol r' + Math.min(o.rank, 3); d.style.setProperty('--tc', st.main); d.style.setProperty('--tcd', st.dark);
    if (o.rank === 1) d.insertAdjacentHTML('beforeend', '<svg class="trophy" viewBox="0 0 100 120" aria-hidden="true"><path d="M25 10h50v28c0 18-11 30-25 30S25 56 25 38z" fill="#FFC928"/><path d="M25 18H8c0 20 8 30 22 32M75 18h17c0 20-8 30-22 32" stroke="#FFC928" stroke-width="7" fill="none"/><rect x="44" y="66" width="12" height="22" fill="#E0A800"/><rect x="28" y="88" width="44" height="12" rx="3" fill="#FFC928"/><rect x="22" y="100" width="56" height="12" rx="3" fill="#B88A00"/></svg>');
    const n = document.createElement('div'); n.className = 'pname'; n.textContent = o.t.name;
    const s = document.createElement('div'); s.className = 'pscore'; s.textContent = String(o.t.score);
    const bar = document.createElement('div'); bar.className = 'pbar'; bar.textContent = String(o.rank);
    d.appendChild(n); d.appendChild(s); d.appendChild(bar); el.podium.appendChild(d);
    return { d, o };
  });
  // potm
  let best = -1, names = [];
  S.teams.forEach(t => t.players.forEach(p => { if (p.pts > best) { best = p.pts; names = [p.name]; } else if (p.pts === best) names.push(p.name); }));
  el.potm.innerHTML = '';
  if (best > 0) { const sp = document.createElement('span'); sp.textContent = names.slice(0, 3).join(', '); el.potm.appendChild(document.createTextNode('Player of the match: ')); el.potm.appendChild(sp); el.potm.appendChild(document.createTextNode(' with ' + best + ' points')); }
  finalTimers.forEach(clearTimeout); finalTimers = [];
  const byRankDesc = cols.slice().sort((a, b) => b.o.rank - a.o.rank);
  const later = (ms, fn) => finalTimers.push(setTimeout(fn, ms));
  sWhistle(true); setMusic(0.3); startRoll();
  byRankDesc.forEach((c, i) => {
    const isWin = c.o.rank === 1, at = 1300 + i * 1700 + (isWin ? 800 : 0);
    later(at, () => {
      if (isWin) { stopRoll(); sHorn(); sFanfare(); crowdRoar(0.7, 4); applause(4, 0.14); confetti(640, 300, 200, [TEAM_STYLE[c.o.t.slot].main, '#FFC928', '#FFFFFF'], 1.3, 1.1); S.flash = REDUCED ? 0 : 0.5; S.excite = 1; setMusic(0.5); say('Full time. ' + c.o.t.name + ' are the champions!', 1, 1.1); }
      else { applause(1.2, 0.08); }
      c.d.classList.add('show');
    });
  });
  later(1300 + (byRankDesc.length - 1) * 1700 + 800 + 1400, () => { el.potm.classList.add('show'); });
  S.fwT = 0; S.fwOn = true;
}

/* ---- menu & wiring ---- */
function refreshMenu() {
  el.mMusic.textContent = 'Music: ' + (AU.musicOn ? 'on' : 'off');
  el.mSfx.textContent = 'Sound effects and crowd: ' + (AU.sfxOn ? 'on' : 'off');
  el.mVoice.textContent = 'Commentary voice: ' + (AU.voiceOn ? 'on' : 'off');
  el.muteBtn.textContent = (AU.musicOn || AU.sfxOn) ? 'Sound on' : 'Sound off';
  el.mQuit.textContent = S.quitArmed ? 'Tap again to quit' : 'Quit to setup';
}
function toggleMusic() { AU.musicOn = !AU.musicOn; if (audioOK()) AU.music.gain.value = AU.musicOn ? 0.34 : 0; refreshMenu(); }
function toggleSfx() { AU.sfxOn = !AU.sfxOn; if (audioOK()) AU.sfx.gain.value = AU.sfxOn ? 0.9 : 0; refreshMenu(); }
function toggleVoice() { AU.voiceOn = !AU.voiceOn; if (!AU.voiceOn && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} } refreshMenu(); }
function goFull() { try { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen(); } catch (e) {} }

function wire() {
  stage.addEventListener('pointerdown', e => { if (e.target.closest('button,textarea,input,#menuPanel,.screen')) return; act(); });
  window.addEventListener('keydown', e => {
    const a = document.activeElement; if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return;
    if (e.code === 'Space' || e.code === 'Enter') { if (S.screen === 'match') { e.preventDefault(); act(); } }
  });
  el.actionBtn.addEventListener('click', () => { initAudio(); act(); el.actionBtn.blur(); });
  el.kickoffBtn.addEventListener('click', () => { initAudio(); sWhistle(false); crowdRoar(0.4, 2); showScreen('setup'); });
  el.resumeBtn.addEventListener('click', () => { initAudio(); if (loadMatch()) { sWhistle(false); enterMatch(); } else { el.resumeBtn.classList.add('hide'); } });
  el.backBtn.addEventListener('click', () => showScreen('title'));
  el.sampleBtn.addEventListener('click', () => { SAMPLE.forEach((p, i) => { $('tp' + i).value = p.join('\n'); }); refreshSetup(); });
  el.startBtn.addEventListener('click', () => { initAudio(); const teams = readSetup().filter(t => t.players.length > 0); if (teams.length < 2) return; S.sdAnnounced = false; sWhistle(true); startMatch(teams); });
  el.menuBtn.addEventListener('click', () => { refreshMenu(); el.menuPanel.classList.remove('hide'); });
  el.mClose.addEventListener('click', () => { S.quitArmed = false; el.menuPanel.classList.add('hide'); });
  el.mMusic.addEventListener('click', toggleMusic); el.mSfx.addEventListener('click', toggleSfx); el.mVoice.addEventListener('click', toggleVoice);
  el.mFull.addEventListener('click', goFull); el.mSkip.addEventListener('click', skipPlayer); el.mCall.addEventListener('click', callAnother); el.absentBtn.addEventListener('click', () => { initAudio(); callAnother(); el.absentBtn.blur(); });
  el.muteBtn.addEventListener('click', () => { const on = AU.musicOn || AU.sfxOn; AU.musicOn = AU.sfxOn = !on; if (audioOK()) { AU.music.gain.value = AU.musicOn ? 0.34 : 0; AU.sfx.gain.value = AU.sfxOn ? 0.9 : 0; } refreshMenu(); });
  el.mQuit.addEventListener('click', () => {
    if (!S.quitArmed) { S.quitArmed = true; refreshMenu(); return; }
    S.quitArmed = false; stopRoll(); lsDel(SAVE_MATCH); el.menuPanel.classList.add('hide'); showScreen('setup');
  });
  el.againBtn.addEventListener('click', () => {
    finalTimers.forEach(clearTimeout); S.fwOn = false;
    S.teams.forEach(t => { t.score = 0; t.disp = 0; t.players.forEach(p => { p.pts = 0; p.kicks = 0; }); });
    S.turns = buildTurns(S.teams); S.t = 0; S.sdN = 0; S.sdAnnounced = false; sWhistle(false); enterMatch();
  });
  el.newBtn.addEventListener('click', () => { finalTimers.forEach(clearTimeout); S.fwOn = false; showScreen('setup'); });
}

/* ================= main loop ================= */
let last = nowS();
function update(dt, t) {
  S.shake = Math.max(0, S.shake - dt * 28);
  S.flash = Math.max(0, S.flash - dt * 2.2);
  S.excite = Math.max(0.15, S.excite - dt * 0.3);
  if (S.phase === 'aim' && S.cur) {
    S.ret = reticleAt(t - S.aimT0);
    S.trail.push({ x: gx(S.ret.x), y: gy(S.ret.y), r: 9, age: 0 });
  }
  if (S.phase === 'power') S.pw = powerAt(t - S.powT0);
  if (S.phase === 'result' && !S.canNext && t - S.resultAt > 1.8) {
    S.canNext = true;
    const lastTurn = S.t + 1 >= S.turns.length;
    setAction(lastTurn ? 'Full time' : 'Next player', true, true);
  }
  if (S.wallJump > 0 && t - S.wallJumpT > 0.6) S.wallJump = 0;
  updateBall(dt, t);
  updateParts(dt);
  if (S.screen === 'match' && S.teams.length) tickScores(dt);
  if (Math.random() < dt * (5 + 70 * S.excite)) flashes.push({ x: rand(40, 1240), y: rand(70, 320), age: 0 });
  if (S.fwOn && S.screen === 'final') {
    S.fwT -= dt;
    if (S.fwT <= 0) { S.fwT = rand(0.5, 1.1); firework(rand(160, 1120), rand(90, 280), pick(['#FF3B4E', '#2F8CFF', '#FFC928', '#C8F31D'])); }
  }
  if (S.screen === 'title' || S.screen === 'setup') { S.ball.rot += dt * 0.5; }
}
function loop() {
  const t = nowS(); const dt = Math.min(0.05, t - last); last = t;
  update(dt, t); drawScene(t);
  requestAnimationFrame(loop);
}

/* ================= boot ================= */
function boot() {
  $('tfiTitle').src = LOGO_SRC; $('tfiFinal').src = LOGO_SRC;
  resize(); buildCrowd(); buildSetupUI(); wire(); refreshMenu();
  showScreen('title');
  if (lsGet(SAVE_MATCH)) { try { const o = JSON.parse(lsGet(SAVE_MATCH)); if (o && o.turns && o.turns[o.t]) el.resumeBtn.classList.remove('hide'); } catch (e) {} }
  try { if (document.fonts && document.fonts.load) { document.fonts.load('40px Anton'); document.fonts.load('700 20px Barlow'); } } catch (e) {}
  requestAnimationFrame(loop);
}
boot();
})();
</script>
